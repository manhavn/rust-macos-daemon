[package]
name = "macdaemon"
version = "0.1.1"
edition = "2021"
description = "A modern, high-performance macOS launchd daemon and agent manager with CLI and Web UI"
authors = ["Bui Van Manh"]
repository = "https://github.com/manhavn/rust-macos-daemon"
homepage = "https://github.com/manhavn/rust-macos-daemon"
license = "MIT"
readme = "README.md"
keywords = ["macos", "launchd", "daemon", "agent", "service-manager"]
categories = ["command-line-utilities", "system::administration"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plist = "1.6"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
open = "5.1"
users = "0.11"
