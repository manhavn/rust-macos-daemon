[package]
name = "macdaemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plist = "1.6"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
open = "5.1"
users = "0.11"
